<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pro Scanner with QR Support</title>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ea2a33",
                        "tech-green": "#00ff9d",
                        "tech-blue": "#00c3ff",
                        "background-light": "#f8f6f6",
                        "background-dark": "#0f172a",
                        "surface-dark": "rgba(15, 23, 42, 0.85)",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem", 
                        "lg": "0.5rem", 
                        "xl": "0.75rem", 
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'glow': '0 0 15px rgba(234, 42, 51, 0.5)',
                        'tech-glow': '0 0 10px rgba(0, 255, 157, 0.3)',
                        'inner-light': 'inset 0 2px 4px 0 rgba(255, 255, 255, 0.1)',
                    }
                },
            },
        }
    </script>
<style>.camera-overlay-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #00ff9d;
            border-style: solid;
            transition: all 0.2s ease;
            opacity: 0.8;
        }
        .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
        .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
        .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
        .shutter-btn:active .inner-circle {
            transform: scale(0.9);
        }
        .data-overlay {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display antialiased h-screen w-full overflow-hidden flex flex-col relative text-slate-100">
<div class="absolute inset-0 z-0 bg-black">
<video id="camera-preview" class="w-full h-full object-cover opacity-70" autoplay playsinline muted></video>
<div id="camera-fallback" class="w-full h-full bg-cover bg-center opacity-70" data-alt="Pokemon trading card on a dark surface ready to be scanned" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDHb--dHLV-YHaRg3797gYcW7_DsyZl2c-RZe3VGXob5jH10XiSCeWUKmXWtH-pWcInpOOE8i6EInGsTc_BHXBb6gewY73aMK0_Cv_qeog_Amg1XKwpHZXY-nI-YIiplaFxY9EFWeX0h9ehbkn69AhpLx5reNZL7Hf3PezWjKoEfObbmSRjssALEuMb18VwNM5rPS0ql2Oyhr5p3tCLpf0gRvwUjJww9mP8rTa22GZ-2WbhvhpS0XQBNb74rNNQN7TyjMYxWodm43Q');"></div>
<div class="absolute inset-0 bg-[linear-gradient(rgba(0,255,157,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(0,255,157,0.03)_1px,transparent_1px)] bg-[size:40px_40px] pointer-events-none"></div>
</div>
<div class="relative z-20 flex flex-col pt-safe-top">
<div class="flex items-center justify-between px-4 pt-4 pb-2">
<button class="flex size-10 items-center justify-center rounded-full bg-surface-dark text-white hover:bg-slate-700 transition-colors border border-white/10">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<div class="flex h-10 items-center rounded-full bg-surface-dark p-1 border border-white/10">
<button id="mode-card-btn" class="flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-white/10 text-xs font-mono font-bold text-tech-green tracking-wide border border-white/5 shadow-inner-light">
<span class="material-symbols-outlined text-[14px]">view_in_ar</span>
                    CARD
                </button>
<button id="mode-barcode-btn" class="flex items-center gap-1.5 px-4 py-1.5 rounded-full hover:bg-white/5 text-xs font-mono font-bold text-slate-400 tracking-wide transition-colors">
<span class="material-symbols-outlined text-[14px]">qr_code_scanner</span>
                    QR
                </button>
</div>
<button id="flash-btn" class="flex size-10 items-center justify-center rounded-full bg-surface-dark text-white hover:bg-slate-700 transition-colors border border-white/10">
<span id="flash-icon" class="material-symbols-outlined text-[20px] text-yellow-400">flash_on</span>
</button>
</div>
</div>
<div class="relative z-10 flex flex-1 flex-col items-center justify-center p-4">
<div class="absolute top-[12%] z-30 animate-in fade-in zoom-in duration-300">
<div class="flex flex-col items-center">
<div class="h-8 w-[1px] bg-tech-green/50 mb-[-1px]"></div>
<div class="data-overlay rounded-xl px-4 py-3 shadow-tech-glow min-w-[180px]">
<p id="scan-status" class="text-[10px] uppercase text-tech-green font-mono tracking-[0.18em] mb-2">Camera ready</p>
<div class="flex justify-between items-start gap-4 border-b border-white/10 pb-2 mb-2">
<div>
<p id="card-name" class="text-[10px] uppercase text-slate-400 font-mono tracking-wider">Charizard VMAX</p>
<p id="card-set" class="text-xs text-slate-300 font-medium">Darkness Ablaze</p>
</div>
<span class="flex h-5 w-5 items-center justify-center rounded bg-tech-green/20 text-tech-green">
<span class="material-symbols-outlined text-[14px]">check</span>
</span>
</div>
<div class="flex items-end justify-between">
<div class="flex flex-col">
<span class="text-[10px] text-slate-400 font-mono">MARKET PRICE</span>
<span id="market-price" class="text-2xl font-bold text-white font-mono tracking-tight">$185.50</span>
</div>
<span id="price-change" class="text-[10px] text-green-400 mb-1 flex items-center gap-0.5">
<span class="material-symbols-outlined text-[12px]">trending_up</span>
                            +2.4%
                        </span>
</div>
</div>
</div>
</div>
<div class="relative aspect-[2.5/3.5] w-full max-w-[280px]">
<div class="absolute inset-0 rounded-lg border-2 border-tech-green shadow-[0_0_20px_rgba(0,255,157,0.2)] bg-tech-green/5 backdrop-blur-[1px]">
<div class="absolute inset-x-0 top-0 h-[1px] bg-tech-green shadow-[0_0_10px_#00ff9d] animate-[scan_2s_linear_infinite] opacity-80"></div>
<div class="absolute top-2 left-2 text-[8px] font-mono text-tech-green/80"><span id="scan-mode-label">MODE: CARD SCAN</span></div>
<div class="absolute bottom-2 right-2 text-[8px] font-mono text-tech-green/80"><span id="scan-confidence">98% CONFIDENCE</span></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[1px] h-full bg-tech-green/30"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[1px] bg-tech-green/30"></div>
</div>
</div>
<div class="camera-overlay-corner corner-tl -ml-2 -mt-2 border-white/40"></div>
<div class="camera-overlay-corner corner-tr -mr-2 -mt-2 border-white/40"></div>
<div class="camera-overlay-corner corner-bl -ml-2 -mb-2 border-white/40"></div>
<div class="camera-overlay-corner corner-br -mr-2 -mb-2 border-white/40"></div>
</div>
</div>
<div class="relative z-20 pb-8 pt-6 px-6 bg-gradient-to-t from-background-dark via-background-dark/95 to-transparent">
<div class="flex items-end justify-between gap-6">
<button class="group flex flex-col items-center gap-2 mb-2">
<div class="flex size-10 items-center justify-center rounded-lg bg-white/5 border border-white/10 transition-colors group-hover:bg-white/10">
<span class="material-symbols-outlined text-slate-300 text-[20px]">photo_library</span>
</div>
</button>
<button id="start-scan-btn" class="shutter-btn group relative flex size-20 items-center justify-center rounded-full transition-transform active:scale-95">
<div class="absolute inset-0 rounded-full border-2 border-white/20"></div>
<div class="absolute inset-[4px] rounded-full border-[3px] border-tech-green shadow-[0_0_15px_rgba(0,255,157,0.4)]"></div>
<div class="inner-circle size-14 rounded-full bg-white flex items-center justify-center shadow-lg">
<div class="size-10 rounded-full bg-slate-100 border border-slate-300"></div>
</div>
</button>
<button class="group flex flex-col items-center gap-2 mb-2 relative">
<div id="scan-count" class="absolute -top-1 -right-1 size-4 bg-primary rounded-full text-[9px] font-bold flex items-center justify-center border border-black z-10">0</div>
<div class="flex size-10 items-center justify-center rounded-lg bg-white/5 border border-white/10 transition-colors group-hover:bg-white/10">
<span class="material-symbols-outlined text-slate-300 text-[20px]">list_alt</span>
</div>
</button>
</div>
<div class="mt-4 rounded-xl border border-white/10 bg-surface-dark/70 p-3">
<div class="flex items-center justify-between gap-3">
<input id="manual-barcode" type="text" placeholder="输入/粘贴条码（测试用）" class="w-full rounded-lg border border-white/10 bg-black/20 px-3 py-2 text-xs text-white placeholder:text-slate-400 focus:border-tech-green focus:ring-tech-green" />
<button id="manual-scan-btn" class="rounded-lg border border-tech-green/40 px-3 py-2 text-xs font-mono text-tech-green hover:bg-tech-green/10">Decode</button>
</div>
<p class="mt-2 text-[10px] text-slate-400">示例条码：123456789012、042100005264、900000001234</p>
</div>
<div class="mx-auto mt-6 h-1 w-1/3 rounded-full bg-white/20"></div>
</div>
<style>
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }.pt-safe-top {
            padding-top: env(safe-area-inset-top, 20px);
        }
    </style>
<script src="scripts/app.js"></script>
</body></html>
